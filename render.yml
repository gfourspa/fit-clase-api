services:
  - type: web
    name: fit-clase-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migrations run inside the container via start-prod.sh before the app starts.
    # Render's preDeployCommand is not executed for Docker-based services.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
